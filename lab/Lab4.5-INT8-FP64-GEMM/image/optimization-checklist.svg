<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">四类通用 GPU 优化思路</title>
  <desc id="desc">四个象限分别展示数据复用与减少全局访存、连续合并访问与布局优化、减少 warp 分支发散、根据误差预算选择精度。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#475569"/></marker>
    <style>
      .title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0f172a}
      .label{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0f172a}
      .small{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}
      .tiny{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}
      .arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="690" fill="#f8fafc"/>
  <text x="50" y="48" class="title">通用优化的四个问题：搬多少、怎么搬、谁在空转、精度花在哪</text>

  <rect x="50" y="82" width="535" height="255" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="78" y="118" class="label">1. 数据复用：减少 HBM 往返</text>
  <rect x="82" y="155" width="105" height="62" rx="9" fill="#bfdbfe" stroke="#2563eb"/><text x="134" y="183" text-anchor="middle" class="small">HBM</text><text x="134" y="204" text-anchor="middle" class="tiny">A/B tile</text>
  <rect x="250" y="145" width="130" height="82" rx="9" fill="#fef3c7" stroke="#d97706"/><text x="315" y="179" text-anchor="middle" class="small">Shared</text><text x="315" y="201" text-anchor="middle" class="tiny">多次复用</text>
  <rect x="445" y="155" width="105" height="62" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="497" y="183" text-anchor="middle" class="small">Register</text><text x="497" y="204" text-anchor="middle" class="tiny">acc tile</text>
  <path d="M187 186 H244" class="arrow"/><path d="M380 186 H439" class="arrow"/>
  <text x="78" y="272" class="small">目标：提高 arithmetic intensity；让一次加载服务多个 MMA。</text>
  <text x="78" y="302" class="small">观察：DRAM bytes、L2 hit rate、Tensor Core 利用率。</text>

  <rect x="615" y="82" width="535" height="255" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="643" y="118" class="label">2. 访问布局：让线程访问可合并</text>
  <g fill="#86efac" stroke="#15803d"><rect x="655" y="155" width="50" height="40"/><rect x="705" y="155" width="50" height="40"/><rect x="755" y="155" width="50" height="40"/><rect x="805" y="155" width="50" height="40"/><rect x="855" y="155" width="50" height="40"/><rect x="905" y="155" width="50" height="40"/><rect x="955" y="155" width="50" height="40"/><rect x="1005" y="155" width="50" height="40"/></g>
  <g class="tiny" text-anchor="middle"><text x="680" y="180">T0</text><text x="730" y="180">T1</text><text x="780" y="180">T2</text><text x="830" y="180">T3</text><text x="880" y="180">T4</text><text x="930" y="180">T5</text><text x="980" y="180">T6</text><text x="1030" y="180">T7</text></g>
  <path d="M655 220 H1055" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="855" y="244" text-anchor="middle" class="tiny">连续地址 → 少量合并事务</text>
  <text x="643" y="272" class="small">同时处理对齐、leading dimension 和边界 tile。</text>
  <text x="643" y="302" class="small">注意：全局内存合并与 Shared Memory bank 冲突是两层问题。</text>

  <rect x="50" y="365" width="535" height="255" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="78" y="401" class="label">3. 控制流：减少 warp divergence</text>
  <g>
    <circle cx="110" cy="465" r="18" fill="#fdba74"/><circle cx="160" cy="465" r="18" fill="#fdba74"/><circle cx="210" cy="465" r="18" fill="#fdba74"/><circle cx="260" cy="465" r="18" fill="#fdba74"/>
    <circle cx="310" cy="465" r="18" fill="#fdba74"/><circle cx="360" cy="465" r="18" fill="#fdba74"/><circle cx="410" cy="465" r="18" fill="#fdba74"/><circle cx="460" cy="465" r="18" fill="#fdba74"/>
  </g>
  <text x="285" y="511" text-anchor="middle" class="small">统一 fast path：所有 lane 执行同一路径</text>
  <text x="78" y="552" class="small">将边界处理拆成独立 kernel，或用 predication 替代复杂分支。</text>
  <text x="78" y="582" class="small">观察：branch efficiency、warp execution efficiency。</text>

  <rect x="615" y="365" width="535" height="255" rx="16" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="643" y="401" class="label">4. 精度预算：把 FP64 用在关键路径</text>
  <rect x="653" y="445" width="120" height="45" rx="8" fill="#fecdd3" stroke="#e11d48"/><text x="713" y="473" text-anchor="middle" class="small">FP64 输入</text>
  <rect x="823" y="445" width="120" height="45" rx="8" fill="#ddd6fe" stroke="#7c3aed"/><text x="883" y="473" text-anchor="middle" class="small">INT8 分量</text>
  <rect x="993" y="445" width="120" height="45" rx="8" fill="#bfdbfe" stroke="#2563eb"/><text x="1053" y="473" text-anchor="middle" class="small">FP64 累加</text>
  <path d="M773 467 H817" class="arrow"/><path d="M943 467 H987" class="arrow"/>
  <text x="643" y="532" class="small">先确定误差目标，再选择 splits、缩放系数精度与累加顺序。</text>
  <text x="643" y="562" class="small">任何降精度都要同时报告吞吐和 L2 相对误差。</text>
  <text x="643" y="592" class="small">禁止只凭“位宽更低”推断端到端一定更快。</text>

  <text x="600" y="661" text-anchor="middle" class="small">优化闭环：profile → 提出一个瓶颈假设 → 单变量修改 → 同时验证性能与精度。</text>
</svg>
