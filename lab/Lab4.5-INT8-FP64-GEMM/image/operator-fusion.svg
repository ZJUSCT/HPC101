<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="融合前与分层融合执行链对比">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .label{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0f172a}
      .box{rx:12;stroke-width:2}
      .arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="250" fill="#f8fafc"/>

  <text x="30" y="63" class="label">融合前</text>
  <rect x="130" y="30" width="155" height="65" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="207.5" y="69" text-anchor="middle" class="label">量化 kernel</text>
  <rect x="345" y="30" width="155" height="65" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="422.5" y="69" text-anchor="middle" class="label">全局内存</text>
  <rect x="560" y="30" width="170" height="65" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="645" y="69" text-anchor="middle" class="label">INT8 GEMM</text>
  <rect x="790" y="30" width="155" height="65" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="867.5" y="69" text-anchor="middle" class="label">全局内存</text>
  <rect x="1005" y="30" width="155" height="65" class="box" fill="#fce7f3" stroke="#db2777"/>
  <text x="1082.5" y="69" text-anchor="middle" class="label">FP64 重组</text>
  <path d="M285 62.5 H340" class="arrow"/>
  <path d="M500 62.5 H555" class="arrow"/>
  <path d="M730 62.5 H785" class="arrow"/>
  <path d="M945 62.5 H1000" class="arrow"/>

  <text x="30" y="188" class="label">分层融合</text>
  <rect x="130" y="155" width="325" height="65" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="292.5" y="194" text-anchor="middle" class="label">一次量化多个 split</text>
  <rect x="540" y="155" width="410" height="65" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="745" y="194" text-anchor="middle" class="label">GEMM + 缩放重组 epilogue</text>
  <rect x="1015" y="155" width="145" height="65" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1087.5" y="194" text-anchor="middle" class="label">输出 C</text>
  <path d="M455 187.5 H535" class="arrow"/>
  <path d="M950 187.5 H1010" class="arrow"/>
</svg>
